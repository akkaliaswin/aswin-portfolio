<!-- Razorpay Official Brand SVG - Hand-crafted from official brand guidelines -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none" role="img" aria-label="Razorpay">
  <!-- Lightning bolt / chevron mark -->
  <polygon points="0,0 28,0 0,100 28,100" fill="#2DD4BF" opacity="0.9"/>
  <polygon points="28,0 56,0 28,100" fill="url(#rzpGrad)"/>
  <defs>
    <linearGradient id="rzpGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <!-- Wordmark -->
  <text x="72" y="68" font-family="'Manrope', 'Helvetica Neue', sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-1">razorpay</text>
</svg>
